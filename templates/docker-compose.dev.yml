# Local development stack.
#   make dev            → app + worker + postgres + redis
#   make dev-obs        → + OTel collector, VictoriaMetrics, Loki, Tempo, Grafana (http://localhost:3000)
#   make dev-temporal   → + Temporal server + UI (http://localhost:8233)
# Pin image versions to what you run in production.
x-app-env: &app-env
  DATABASE_URL: postgresql+asyncpg://app:app@postgres:5432/app
  REDIS_URL: redis://redis:6379/0
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
  OTEL_SERVICE_NAME: app
  TEMPORAL_ADDRESS: temporal:7233
  ENV: dev

services:
  app:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports: ["8000:8000"]
    environment: *app-env
    env_file: [{ path: .env, required: false }]
    volumes: ["./app:/app/app"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }

  worker:
    build: .
    command: celery -A app.worker.celery_app worker -l info --concurrency=2
    environment: *app-env
    env_file: [{ path: .env, required: false }]
    depends_on: [redis, postgres]

  postgres:
    image: postgres:16
    environment: { POSTGRES_USER: app, POSTGRES_PASSWORD: app, POSTGRES_DB: app }
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD", "pg_isready", "-U", "app"], interval: 5s, retries: 10 }

  redis:
    image: redis:7
    ports: ["6379:6379"]

  # ---------------- observability (profile: obs) ----------------
  otel-collector:
    profiles: [obs]
    image: otel/opentelemetry-collector-contrib:latest
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes: ["./observability/otel-collector.yaml:/etc/otelcol/config.yaml:ro"]
    ports: ["4317:4317", "4318:4318"]
    depends_on: [victoriametrics, loki, tempo]

  victoriametrics:
    profiles: [obs]
    image: victoriametrics/victoria-metrics:latest
    command: ["-retentionPeriod=7d", "-opentelemetry.usePrometheusNaming"]
    ports: ["8428:8428"]

  loki:
    profiles: [obs]
    image: grafana/loki:latest
    command: ["-config.file=/etc/loki/local-config.yaml"]
    ports: ["3100:3100"]

  tempo:
    profiles: [obs]
    image: grafana/tempo:latest
    command: ["-config.file=/etc/tempo.yaml"]
    volumes: ["./observability/tempo.yaml:/etc/tempo.yaml:ro"]
    ports: ["3200:3200"]

  grafana:
    profiles: [obs]
    image: grafana/grafana:latest
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_FEATURE_TOGGLES_ENABLE: traceqlEditor
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]
    depends_on: [victoriametrics, loki, tempo]

  # ---------------- durable workflows (profile: temporal) ----------------
  temporal:
    profiles: [temporal]
    image: temporalio/auto-setup:latest
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: app
      POSTGRES_PWD: app
      POSTGRES_SEEDS: postgres
    ports: ["7233:7233"]
    depends_on:
      postgres: { condition: service_healthy }

  temporal-ui:
    profiles: [temporal]
    image: temporalio/ui:latest
    environment: { TEMPORAL_ADDRESS: temporal:7233 }
    ports: ["8233:8080"]
    depends_on: [temporal]

  temporal-worker:
    profiles: [temporal]
    build: .
    command: python -m app.workflows.worker
    environment: *app-env
    depends_on: [temporal]

volumes:
  pgdata:
